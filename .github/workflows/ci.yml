name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: secure-mail-backend/requirements.txt
      - name: Install dependencies
        run: pip install -r secure-mail-backend/requirements.txt
      - name: Compile
        run: python -m compileall secure-mail-backend/app
      - name: Import app
        working-directory: secure-mail-backend
        run: python -c "from app.main import app; assert any(r.path == '/health' for r in app.routes)"
